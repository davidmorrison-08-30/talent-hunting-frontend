server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets can be cached aggressively; index.html must not be,
    # otherwise a deploy would keep serving the old bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Single-page app: unknown paths fall back to the entry document.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Containers run as a non-root user, so bind to a high port and let
    # nginx drop privileges internally.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
